version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cloudrad_postgres
    environment:
      POSTGRES_USER: cloudrad_admin
      POSTGRES_PASSWORD: cloudrad_password
      POSTGRES_DB: cloudrad_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  orthanc:
    image: osimis/orthanc
    container_name: cloudrad_orthanc
    ports:
      - "4242:4242" # DICOM
      - "8042:8042" # HTTP
    environment:
      - ORTHANC_NAME=CloudRad PACS
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cloudrad_db
      - POSTGRES_USER=cloudrad_admin
      - POSTGRES_PASSWORD=cloudrad_password
      - OSIMIS_WEB_VIEWER1_PLUGIN_ENABLED=true
      - OHIF_PLUGIN_ENABLED=true
      - DICOM_WEB_PLUGIN_ENABLED=true
      - POSTGRESQL_PLUGIN_ENABLED=true
      - ORTHANC__CORS_ALLOW_ORIGIN=*
      - ORTHANC__CORS_ALLOW_CREDENTIALS=true
      - ORTHANC__CORS_ALLOW_HEADERS=Origin, X-Requested-With, Content-Type, Accept, Authorization
      - ORTHANC__CORS_ALLOW_METHODS=GET, POST, PUT, DELETE, OPTIONS
    depends_on:
      - db
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    restart: always

  backend:
    build: ./backend
    container_name: cloudrad_fastapi
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cloudrad_db
      - POSTGRES_USER=cloudrad_admin
      - POSTGRES_PASSWORD=cloudrad_password
      - ORTHANC_URL=http://cloudrad_orthanc:8042
      - JWT_SECRET=cloudrad-dev-secret-change-in-production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
      - orthanc
    restart: always

  frontend:
    image: node:20
    container_name: cloudrad_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev"
    init: true

volumes:
  postgres_data:
  orthanc_data:
