version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudrad_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ORTHANC_URL=http://orthanc:8042
      - ORTHANC_USER=${ORTHANC_USER}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
      - DATABASE_URL=sqlite:///./cloudrad.db # Change to PostgreSQL URL in real production
    volumes:
      - ./backend/data:/app/data # For SQLite database persistence
    depends_on:
      - orthanc

  orthanc:
    image: jodogne/orthanc-plugins
    container_name: cloudrad_orthanc
    restart: always
    ports:
      - "8042:8042" # HTTP port (REST API & Web UI)
      - "4242:4242" # DICOM port
    environment:
      - ORTHANC_NAME=CloudRad PACS
      - WADO_URI_ENABLE=true
      # We pass the credentials from the top-level .env so Orthanc requires them for HTTP basic auth
    volumes:
      - orthanc_storage:/var/lib/orthanc/db/
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro # Custom config if needed
    command: /etc/orthanc/

volumes:
  orthanc_storage:
