version: '3.8'

services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    restart: always

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    container_name: nginx-proxy-letsencrypt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    environment:
      - DEFAULT_EMAIL=admin@167-233-227-144.nip.io
      - NGINX_PROXY_CONTAINER=nginx-proxy
    depends_on:
      - nginx-proxy
    restart: always

  db:
    image: postgres:15
    container_name: cloudrad_postgres_prod
    environment:
      POSTGRES_USER: cloudrad_admin
      POSTGRES_PASSWORD: cloudrad_secure_prod_password
      POSTGRES_DB: cloudrad_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    container_name: cloudrad_fastapi_prod
    environment:
      - VIRTUAL_HOST=api.167-233-227-144.nip.io
      - LETSENCRYPT_HOST=api.167-233-227-144.nip.io
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cloudrad_db
      - POSTGRES_USER=cloudrad_admin
      - POSTGRES_PASSWORD=cloudrad_secure_prod_password
      - ORTHANC_URL=http://orthanc:8042
      - JWT_SECRET=f7e4b9d8a1c6e2f5d9c2a6b8e3f4c1a7d5b8e9c4f2a1d6b3e7c5f8a9d2c1b4e6
      - CORS_ORIGINS=https://cloudrad-mvp-frontend.vercel.app,http://localhost:5173
      - FRONTEND_URL=https://cloudrad-mvp-frontend.vercel.app
    depends_on:
      - db
    restart: always

  orthanc:
    image: osimis/orthanc:21.2.0
    container_name: cloudrad_orthanc_prod
    environment:
      - VIRTUAL_HOST=pacs.167-233-227-144.nip.io
      - LETSENCRYPT_HOST=pacs.167-233-227-144.nip.io
      - VIRTUAL_PORT=8042
      - ORTHANC_NAME=CloudRad Production PACS
      - ORTHANC__POSTGRESQL__HOST=db
      - ORTHANC__POSTGRESQL__PORT=5432
      - ORTHANC__POSTGRESQL__DATABASE=cloudrad_db
      - ORTHANC__POSTGRESQL__USERNAME=cloudrad_admin
      - ORTHANC__POSTGRESQL__PASSWORD=cloudrad_secure_prod_password
      - OSIMIS_WEB_VIEWER1_PLUGIN_ENABLED=true
      - OHIF_PLUGIN_ENABLED=true
      - DICOM_WEB_PLUGIN_ENABLED=true
      - POSTGRESQL_PLUGIN_ENABLED=true
      - ORTHANC__AUTHENTICATION_ENABLED=false
      - ORTHANC__CORS_ALLOW_ORIGIN=*
      - ORTHANC__CORS_ALLOW_CREDENTIALS=true
    depends_on:
      - db
    volumes:
      - orthanc_prod_data:/var/lib/orthanc/db
    restart: always

volumes:
  certs:
  vhost:
  html:
  postgres_prod_data:
  orthanc_prod_data:
